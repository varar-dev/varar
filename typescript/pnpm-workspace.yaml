packages:
  - packages/*
  - ../examples/typescript-vitest

# `pnpm update --latest` ignores the semver ranges in package.json, so nothing
# written in a manifest can stop it walking packages/website from typescript 6
# to 7 — which silently breaks the example editors, since 7 is the native Go
# compiler with no in-process API to type-check or transpile with in a browser
# (see the Stack section of CLAUDE.md). This list is the only thing that holds
# it: `pnpm.updateConfig` in a workspace member's own package.json is read by
# nothing, and only the entry here takes effect.
#
# It is name-based and workspace-wide, so it also parks the ROOT's typescript at
# the next release — `pnpm up -rL` will not move it to 7.1 on its own. That is
# deliberate: a compiler upgrade is a decision, not a drive-by. Naming the
# package explicitly (`pnpm up -L typescript`) overrides this list.
updateConfig:
  ignoreDependencies:
    - typescript

# Dependencies allowed to run install scripts. pnpm blocks them by default as a
# supply-chain measure and fails the install (exit 1, in CI as much as
# interactively) until each one is decided either way.
#
# esbuild is the only yes: its install script fetches the platform binary, and
# vite/vitest are unusable without it.
#
# Every tree-sitter grammar is a deliberate NO. Their install script is
# `node-gyp-build`, which produces the NATIVE node binding — and Varar never
# loads that. The scanner runs the grammars through web-tree-sitter, reading the
# `.wasm` files the packages already ship prebuilt (see the `*.wasm` entries in
# their `files`, and every grammar loader: lsp/src/node-grammar-loader.ts,
# vitest/src/node-grammar-loader.ts, the var-vscode bundler's copy list).
# Denying them skips a native compile that nothing uses and drops the
# requirement for a C toolchain to install this repo.
#
# workerd and sharp@0.34 arrive with wrangler, which the deploy-website CI job
# installs on the fly (cloudflare/wrangler-action's `pnpm add wrangler@4`) — an
# install that pnpm fails outright while they are undecided. Both are a NO:
# workerd is the local `wrangler dev` runtime and sharp is miniflare's image
# resizer, and the job neither serves nor resizes anything — it uploads the
# prebuilt static assets (packages/website/wrangler.jsonc has `assets` and no
# worker script). Note the website's own sharp (0.35, for Astro's image
# optimisation) has no install script at all: it resolves the prebuilt binary
# through optional dependencies, so this entry never touches it.
allowBuilds:
  esbuild: true
  workerd: false
  sharp: false
  '@tree-sitter-grammars/tree-sitter-kotlin': false
  tree-sitter-c-sharp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-ruby: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
