name: TypeScript

on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - 'conformance/**'
      - 'examples/**'
      - 'varar.config.json'
      - '.github/workflows/typescript.yml'
  pull_request:
    paths:
      - 'typescript/**'
      - 'conformance/**'
      - 'examples/**'
      - 'varar.config.json'
      - '.github/workflows/typescript.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      # No version here — pnpm/action-setup reads "packageManager" from
      # typescript/package.json, the same field corepack uses locally.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      # No version here — .node-version is the pin, read by setup-node and by
      # nvm/fnm/asdf alike, so CI and a developer machine cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check

      # Build the website on PRs too: `pnpm build`/`pnpm check` exclude it, but
      # its <Editor> components assert at build time that every port in
      # languages.json has example files, so this is where a forgotten port's
      # missing examples become a red build instead of surfacing only at deploy.
      - run: pnpm --filter @varar/website... build

      # The adapter smoke contract: the golden corpora only see the pure core, so an
      # adapter can be conformance-green and still test nothing. This runs the sample's
      # real test command against a deliberately drifted baseline and requires it to go
      # red. See conformance/adapter/README.md.
      - run: conformance/adapter/smoke.sh examples/typescript-vitest
        working-directory: .

  deploy-website:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      # No version here — pnpm/action-setup reads "packageManager" from
      # typescript/package.json, the same field corepack uses locally.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      # No version here — .node-version is the pin, read by setup-node and by
      # nvm/fnm/asdf alike, so CI and a developer machine cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: typescript/.node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @varar/website... build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: typescript/packages/website
          wranglerVersion: "4"
          packageManager: pnpm
